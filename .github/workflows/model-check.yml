# Runs a real on-device model (downloaded from Hugging Face, which the tests can't do) through both of
# the coach's engines: the in-app one (WebAssembly, in Chromium) and the native one (built for the
# runner, and by hand also on an arm64 runner like a phone's CPU). Prints the answers and timings. It
# runs when the coach's code changes (the in-app engine with the Fast model, the native one with Fast
# and Balanced), or by hand from the Actions tab with any size.
# The pins job reads the model pins for src/llm.js (each file's commit, exact size and SHA-256) from
# the Hub, by hand or when src/llm.js or this workflow changes.
name: Model check

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - src/llm.js
      - src/devicecoach.js
      - src/coach.js
      - src/tailor.js
      - android/jni/**
      - test/model-check.mjs
      - test/model-prompts.mjs
      - .github/workflows/model-check.yml
  workflow_dispatch:
    inputs:
      model:
        description: 'Which size: fast (0.8B), balanced (2B) or best (4B)'
        default: fast
        type: choice
        options: [fast, balanced, best]
      arm:
        description: 'Also on an arm64 runner (needs arm64 runners for this repository)'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  in-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Which model
        id: which
        run: echo "file=$(case '${{ inputs.model }}' in balanced) echo Qwen3.5-2B-Q4_K_M.gguf ;; best) echo Qwen3.5-4B-Q4_K_M.gguf ;; *) echo Qwen3.5-0.8B-Q4_K_M.gguf ;; esac)" >> "$GITHUB_OUTPUT"
      - name: Cache the model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ steps.which.outputs.file }}
          key: model-${{ steps.which.outputs.file }}
      - name: Download the model
        id: model
        run: |
          case "${{ inputs.model }}" in
            balanced) f=Qwen3.5-2B-Q4_K_M.gguf; repo=unsloth/Qwen3.5-2B-GGUF; id=q35-2 ;;
            best) f=Qwen3.5-4B-Q4_K_M.gguf; repo=unsloth/Qwen3.5-4B-GGUF; id=q35-4 ;;
            *) f=Qwen3.5-0.8B-Q4_K_M.gguf; repo=unsloth/Qwen3.5-0.8B-GGUF; id=q35-08 ;;
          esac
          mkdir -p build
          [ -s "build/$f" ] || curl -fsSL --retry 3 -o "build/$f" "https://huggingface.co/$repo/resolve/main/$f"
          echo "file=build/$f" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "$f: $(stat -c %s "build/$f") bytes, SHA-256 $(sha256sum "build/$f" | cut -d' ' -f1)"
      - name: Playwright and Chromium
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node test/model-check.mjs "${{ steps.model.outputs.file }}" "${{ steps.model.outputs.id }}"

  native:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.arm && '["ubuntu-24.04", "ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') }}
        # On a push, Fast and Balanced; by hand, the size picked.
        model: ${{ fromJSON(inputs.model && format('["{0}"]', inputs.model) || '["fast", "balanced"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Which model
        id: which
        run: echo "file=$(case '${{ matrix.model }}' in balanced) echo Qwen3.5-2B-Q4_K_M.gguf ;; best) echo Qwen3.5-4B-Q4_K_M.gguf ;; *) echo Qwen3.5-0.8B-Q4_K_M.gguf ;; esac)" >> "$GITHUB_OUTPUT"
      - name: Cache the model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/${{ steps.which.outputs.file }}
          key: model-${{ steps.which.outputs.file }}
      - name: Download the model
        id: model
        run: |
          case "${{ matrix.model }}" in
            balanced) f=Qwen3.5-2B-Q4_K_M.gguf; repo=unsloth/Qwen3.5-2B-GGUF; id=q35-2 ;;
            best) f=Qwen3.5-4B-Q4_K_M.gguf; repo=unsloth/Qwen3.5-4B-GGUF; id=q35-4 ;;
            *) f=Qwen3.5-0.8B-Q4_K_M.gguf; repo=unsloth/Qwen3.5-0.8B-GGUF; id=q35-08 ;;
          esac
          mkdir -p build
          [ -s "build/$f" ] || curl -fsSL --retry 3 -o "build/$f" "https://huggingface.co/$repo/resolve/main/$f"
          echo "file=build/$f" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build the native engine for this runner
        run: |
          git clone -q --depth 1 --branch b10663 https://github.com/ggml-org/llama.cpp build/llama.cpp
          test "$(git -C build/llama.cpp rev-parse HEAD)" = 83d855c5a6d70487121edbf4020b25c96b7a04e7
          cmake -S android/jni -B build/native-host -DLLAMA_SRC=build/llama.cpp -DGHLLM_HOST_TEST=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host -j 4 --target ghllm_ask
      - name: Ask it the coach's questions, as the app asks them
        run: |
          node -e "global.window=global;require('./src/tailor.js');require('fs').writeFileSync('build/tailor.gbnf', GH.tailor.GRAMMAR)"
          node test/model-prompts.mjs write build/prompts "${{ steps.model.outputs.id }}"
          # One thread per core: more than the runner has makes llama.cpp's threads wait on each other.
          build/native-host/ghllm_ask "${{ steps.model.outputs.file }}" "$(nproc)" build/tailor.gbnf build/prompts
          node test/model-prompts.mjs read build/prompts "${{ steps.model.outputs.id }}"

  # The pins for src/llm.js. Hugging Face can't be reached from where the app is written, so this
  # reads them here: for each Qwen3.5 file in src/llm.js, the repo's current commit (X-Repo-Commit),
  # then the file itself at that commit, whose SHA-256 and size must match what the Hub says it is
  # (X-Linked-Etag, X-Linked-Size), and which must be a GGUF file. It prints the PINS lines to paste
  # into src/llm.js, here and in the run's summary. By hand from the Actions tab, or on a push that
  # changes src/llm.js or this workflow.
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Only for src/llm.js or this workflow (or by hand)
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          run=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # The files this push changed; if GitHub can't say, pin anyway.
            if files="$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')"; then
              printf '%s\n' "$files" | grep -qxE 'src/llm\.js|\.github/workflows/model-check\.yml' || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Pin each Qwen3.5 file
        if: steps.changed.outputs.run == 'true'
        run: |
          set -euo pipefail
          # The files src/llm.js asks for: pinned('<owner>/<repo>', '<file>', <size on its page>).
          node -e '
            const src = require("fs").readFileSync("src/llm.js", "utf8");
            for (const m of src.matchAll(/pinned\(\x27([\w.-]+\/[\w.-]+)\x27, \x27([\w.-]+\.gguf)\x27/g)) console.log(`${m[1]} ${m[2]}`);
          ' > "$RUNNER_TEMP/models.txt"
          [ -s "$RUNNER_TEMP/models.txt" ] || { echo "::error::No pinned('<repo>', '<file>', ...) entries found in src/llm.js"; exit 1; }
          pins="$RUNNER_TEMP/pins.js"
          echo "const PINS = {" > "$pins"
          # A response header's value (names in any case: HTTP/2 sends them in lower case).
          header() { printf '%s\n' "$2" | tr -d '\r' | awk -v k="$(printf '%s' "$1" | tr 'A-Z' 'a-z'):" 'tolower($1) == k { sub(/^[^:]*:[ ]*/, ""); print; exit }'; }
          while read -r repo file; do
            echo "::group::$repo $file"
            # The Hub's answer for the main branch: its commit, and the file's SHA-256 and size. No
            # redirect followed: those headers are on the Hub's own response.
            head="$(curl -sSI --retry 3 --retry-all-errors "https://huggingface.co/$repo/resolve/main/$file")"
            commit="$(header X-Repo-Commit "$head")"
            hub_sha="$(header X-Linked-Etag "$head" | sed -e 's/^W\///' -e 's/"//g')"
            hub_size="$(header X-Linked-Size "$head")"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$file: the Hub sent no commit (X-Repo-Commit)"; exit 1; }
            # The file itself, at that commit: what the phone will download.
            curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/model.gguf" "https://huggingface.co/$repo/resolve/$commit/$file"
            sha="$(sha256sum "$RUNNER_TEMP/model.gguf" | cut -d' ' -f1)"
            size="$(stat -c %s "$RUNNER_TEMP/model.gguf")"
            magic="$(head -c 4 "$RUNNER_TEMP/model.gguf")"
            rm -f "$RUNNER_TEMP/model.gguf"
            [ "$magic" = GGUF ] || { echo "::error::$file at $commit isn't a GGUF file"; exit 1; }
            if [[ "$hub_sha" =~ ^[0-9a-f]{64}$ ]]; then
              [ "$sha" = "$hub_sha" ] || { echo "::error::$file: SHA-256 $sha, but the Hub says $hub_sha"; exit 1; }
            else
              echo "::warning::$file: the Hub sent no SHA-256 (X-Linked-Etag) to check against"
            fi
            if [[ "$hub_size" =~ ^[0-9]+$ ]]; then
              [ "$size" = "$hub_size" ] || { echo "::error::$file: $size bytes, but the Hub says $hub_size"; exit 1; }
            else
              echo "::warning::$file: the Hub sent no size (X-Linked-Size) to check against"
            fi
            echo "$file: commit $commit, $size bytes, SHA-256 $sha"
            printf "  '%s': { commit: '%s', sha256: '%s', bytes: %s },\n" "$file" "$commit" "$sha" "$size" >> "$pins"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/models.txt"
          echo "};" >> "$pins"
          echo "Paste over PINS in src/llm.js:"
          cat "$pins"
          {
            echo "### Model pins for src/llm.js"
            echo
            echo "Each file was downloaded at its commit and checked against the Hub's SHA-256 and size. Paste over \`PINS\` in src/llm.js:"
            echo
            echo '```js'
            cat "$pins"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
