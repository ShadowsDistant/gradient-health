name: Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

# Every run replaces the single "latest" release, so runs must not overlap.
concurrency:
  group: android-apk-latest-release
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt dalvik-exchange zipalign apksigner

      - name: Cache Android framework jar and bundletool
        uses: actions/cache@v4
        with:
          path: ~/.cache/gradient-health
          key: android-all-14-robolectric-10818077-bundletool-1.18.1

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Check the committed dist/ is up to date
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- dist/)"
          if [ -n "$untracked" ]; then
            echo "::error::dist/ has files that are not committed: $untracked"
            exit 1
          fi

      # The on-device coach's native engine (android/jni on llama.cpp). When its code changes: the core
      # is built for the runner and tested against a tiny random-weight model, then the arm64
      # libraries are built for the app. Otherwise the cached libraries are used.
      - name: NDK version
        id: ndk
        # The same NDK scripts/build-native.sh picks (ANDROID_NDK_HOME first).
        run: echo "name=$(basename "${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-none}}")" >> "$GITHUB_OUTPUT"

      - name: Cache the native engine
        id: native-cache
        uses: actions/cache@v4
        with:
          path: build/native
          key: native-${{ hashFiles('android/jni/**', 'scripts/build-native.sh') }}-${{ steps.ndk.outputs.name }}

      - name: Native engine, host test
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv build/venv
          build/venv/bin/pip install --quiet gguf==0.19.0 numpy==2.4.6
          bash scripts/build-native.sh --host

      - name: Build the native engine (arm64)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native.sh

      # One versionCode for the APK and the bundle (Play needs it to grow with every upload).
      - name: Version code
        run: echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      # The release key lives in the repository's secrets (docs/DEVELOPING.md, Publishing). Without
      # it the build is signed with the public test key, which is fine for trying it but not a store.
      - name: Release signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No RELEASE_KEYSTORE_B64 secret: this build is signed with the public test key (not for a store)."
            echo "SIGNED_WITH=test" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: bash scripts/build-apk.sh

      - name: Build the Android App Bundle (for Google Play)
        env:
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: bash scripts/build-aab.sh

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: gradient-health-apk
          path: |
            build/gradient-health.apk
            build/gradient-health.aab
          if-no-files-found: error

      - name: Publish the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED_WITH" = "release" ]; then
            signed="Signed with the release key: the APK is the one for APKPure and direct installs, and the .aab is the upload for Google Play."
          else
            signed="Signed with the public test key, for trying it out only. A release-signed build won't install over this one."
          fi
          # What's new in this version from src/data/changelog.js, with the short store text to paste
          # into APKPure's or Play's What's new field, then how this build was made.
          version="$(node -p "require('./package.json').version")"
          {
            node scripts/release-notes.mjs
            printf '\n---\n\nBuilt from %s on %s (versionCode %s). %s Install over the previous version to keep your data.\n' \
              "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$VERSION_CODE" "$signed"
          } > "$RUNNER_TEMP/release-notes.md"
          # GitHub's API now and then turns a release request down for a moment (an HTTP 403 once, with
          # the next run fine), so each step gets three tries.
          for i in 1 2 3; do
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            if gh release create latest build/gradient-health.apk build/gradient-health.aab \
              --title "Gradient Health ${version} (latest build)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA" \
              --latest; then
              exit 0
            fi
            echo "Publishing the release didn't work (try $i of 3)"
            sleep $((i * 15))
          done
          exit 1
