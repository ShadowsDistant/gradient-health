<svg xmlns="http://www.w3.org/2000/svg" width="172" height="40" viewBox="0 0 172 40" role="img" aria-label="Built with Refract">
  <title>Built with Refract</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202838"/>
      <stop offset="1" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="12" y1="9" x2="34" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fe3c8"/>
      <stop offset=".5" stop-color="#3aa8ff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="23" cy="20" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3aa8ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#3aa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x=".5" y=".5" width="171" height="39" rx="19.5" fill="url(#fill)"/>
  <rect x=".5" y=".5" width="171" height="39" rx="19.5" fill="url(#glow)"/>
  <path d="M20 .5h132a19.5 19.5 0 0 1 19.5 19.5H.5A19.5 19.5 0 0 1 20 .5z" fill="url(#sheen)"/>
  <rect x=".5" y=".5" width="171" height="39" rx="19.5" fill="none" stroke="url(#rim)"/>
  <!-- Refract's mark (as Refract's .rf-mark draws it, 24 px): two half-discs a sliver apart, the top
       one shifted left and the bottom one right. -->
  <path fill="url(#mark)" d="M10.88 19.4A9 9 0 0 1 28.88 19.4ZM13.13 20.6A9 9 0 0 0 31.13 20.6Z"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="40" y="24.6" font-size="13.5" fill="#c3cbdb" textLength="54" lengthAdjust="spacing">Built with</text>
    <text x="99" y="24.8" font-size="14.5" font-weight="700" fill="#ffffff" textLength="54" lengthAdjust="spacing">Refract</text>
  </g>
</svg>
